cv:
  name: Leonardo Oliveira
  label: X-ray diffraction and imaging scientist
  email: leo.official.mail@gmail.com
  location: Lund, Sweden
  summary: >-
    X-ray diffraction and imaging scientist with 7+ years of laboratory and synchrotron experience linking structure,
    processing and properties in advanced materials. Core methods are Rietveld and Le Bail refinement, texture analysis and
    in situ diffraction, plus strain and tilt mapping by dark-field X-ray microscopy (DFXM) and nano-diffraction (nano-XRD).

  social_networks:
    - network: ORCID
      username: 0000-0001-9999-206X
    - network: LinkedIn
      username: leonardosoliveira
    - network: GitHub
      username: leosdo

  sections:
    Experience:
      - company: Lund University and MAX IV Laboratory (NanoMAX beamline)
        position: Postdoctoral researcher
        location: Lund, Sweden
        start_date: 2024
        end_date: present
        summary: Lead structural characterization across industry and university projects on electromechanical device materials.
        highlights:
          - Investigated the origin of electrostriction and giant piezoelectricity in Hf₀.₅Zr₀.₅O₂ device stacks (with DTU).
          - Resolved nanoscale ferroelectric domain dynamics under electrical bias and nano-indentation (with ETH Zurich and Chalmers), linking mechanical and electrical stimuli to local switching behavior and phase transitions.
          - Collaborated with Hexagem AB to correlate structural heterogeneity with emission deficiencies in InGaN nanoLEDs.
          - Built Python scripts for real-time image processing to support users' on-the-fly decision making during experiments.

      - company: Department of Physics, Technical University of Denmark (DTU)
        position: PhD researcher
        location: Copenhagen, Denmark
        start_date: 2021
        end_date: 2024
        summary: Quantified how local structure and residual stress govern energy storage in lead-free dielectric ceramics.
        highlights:
          - Direct evidence that local residual stress disrupts antiferroelectric stability and energy storage in NaNbO₃.
          - Produced the first direct strain imaging of pure antiferroelectric domains.
          - Established the role of site disorder in (1-x)BiFeO₃-xSrTiO₃ relaxor ferroelectric functionality.
          - Planned and executed beamtime at ESRF in collaboration with European and Chinese partners.

